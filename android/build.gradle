// NOTE: no top-level `buildscript { classpath "com.android.tools.build:gradle:..." }`
// block here anymore. A library module that gets autolinked into a host app
// must NOT declare its own AGP classpath — it inherits AGP/Gradle from the
// host app's root build.gradle. Keeping a hardcoded "8.0.0" here is what was
// causing version-conflict / "buildscript already configured" failures once
// this got pulled into an app on a newer AGP.

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"   // always applied now — needed for autolinking +
                                      // the Interop Layer to register this legacy-style
                                      // module correctly on New Architecture builds.
                                      // (newArchEnabled flag no longer exists to gate this on.)

android {
    namespace "com.uhfrfidlibrary.uhf"   // unconditional — AGP 8+ requires this,
                                          // no more supportsNamespace()/AndroidManifestNew.xml hack.

    compileSdk 35

    defaultConfig {
        minSdkVersion 21   // RN's own New Architecture runtime requires 23+; raise if your
                            // app's minSdkVersion is already higher.
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable "GradleCompatible"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    google()
}

dependencies {
    implementation "com.facebook.react:react-android"   // new coordinate; "com.facebook.react:react-native:+"
                                                          // is the old artifact name and is no longer
                                                          // published for recent RN versions.
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
